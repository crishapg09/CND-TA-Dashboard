name: Deploy dashboard to GitHub Pages

# Publishes the TA Management Dashboard to GitHub Pages.
#
#   /            -> the CND & Climate TA Management Dashboard (Global Practice
#                   filter). This is the committed, self-contained static page
#                   design/nutrition-ta-dashboard.html, generated by
#                   scripts/gen_dashboard.py. No build step, so it cannot fail.
#   /performance/ -> the separate React performance-management dashboard (app/).
#                   Built here as a best effort; if its build fails the main
#                   dashboard above still publishes.
#
# Before this can work you must, in the repo's Settings -> Pages, set
# "Source" to "GitHub Actions". Pages sites are PUBLIC; both dashboards embed
# the real case/staff data, so only enable this if that exposure is intended.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site — TA dashboard at the root
        run: |
          mkdir -p site
          cp design/nutrition-ta-dashboard.html site/index.html
          # Pages serves .nojekyll-less sites through Jekyll, which would skip
          # files it considers special; opt out so everything is served as-is.
          touch site/.nojekyll
          ls -lh site/index.html

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the React performance dashboard (best effort)
        id: react
        continue-on-error: true
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Add the performance dashboard at /performance/
        if: steps.react.outcome == 'success'
        run: |
          mkdir -p site/performance
          cp -r app/dist/. site/performance/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
