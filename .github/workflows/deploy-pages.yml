name: Deploy dashboard to GitHub Pages

# Builds the React performance dashboard (in app/) and publishes it to GitHub
# Pages. Runs on pushes to main, or manually from the Actions tab.
#
# Before this can work you must, in the repo's Settings -> Pages, set
# "Source" to "GitHub Actions". Pages sites are PUBLIC; the built app embeds
# the real case/staff data, so only enable this if that exposure is intended.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and build
        working-directory: app
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
