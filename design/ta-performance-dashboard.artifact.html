ulatory framework for improved food enviroments  (front of Pack Nutrition Labelling &  Restricted Marketing of unhealthy foods)","xs":46023.0,"xc":46387.0,"cr":46141.47622685185,"op":46141.47622685185,"up":46189.160150462965,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0012485","type":"Big Ticket","region":"MENAR","office":"Djibouti","practice":"Child Nutrition and Development","offer":"Programme Management Scale-Up Support","modality":"Hybrid","status":"25%","lead":"Manpreet Kaur Chadha","reqFor":"Juliet Alyek Ochero","desc":"Technical assistance to support policy reform and programme design for the first food agenda.","full":"Technical assistance to support policy reform and programme design for the first food agenda","xs":46204.0,"xc":46387.0,"cr":46141.47621527778,"op":46141.47621527778,"up":46233.199016203704,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0012486","type":"Big Ticket","region":"EAPR","office":"Mongolia","practice":"Child Nutrition and Development","offer":"Programme Management Scale-Up Support","modality":"Hybrid","status":"25%","lead":"Alison Feeley","reqFor":"Yan Mu","desc":"Technical assistance to support obesity prevention policies including marketing restrictions, SSB taxes, and advocacy in Mongolia.","full":"Technical assistance to support the Government of Mongolia to strengthen obesity prevention policies, including: (i) development of policies and draft legislation on restrictions on the marketing of unhealthy foods and beverages, informed by a national study on marketing practices; (ii) preparation and technical support for the implementation of Sugar-Sweetened Beverage (SSB) taxes, effective from January 2027; and (iii) support to policy dialogue and high-level advocacy on obesity prevention.","xs":46113.0,"xc":46387.0,"cr":46141.47622685185,"op":46141.47622685185,"up":46189.18837962963,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0012487","type":"Big Ticket","region":"EAPR","office":"Solomon, Republic of Marshall Islands","practice":"Child Nutrition and Development","offer":"Programme Management Scale-Up Support","modality":"Hybrid","status":"50%","lead":"Roland Kupka","reqFor":"Penjani Kamudoni","desc":"CNF technical assistance to support 1-3 Pacific Island Countries with proposal development.","full":"CNF TA to support 1-3 PICs with development of proposals","xs":46023.0,"xc":46387.0,"cr":46141.47621527778,"op":46141.47621527778,"up":46141.47621527778,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0012488","type":"Big Ticket","region":"ESAR","office":"Eritrea","practice":"Child Nutrition and Development","offer":"Programme Management Scale-Up Support","modality":"Hybrid","status":"25%","lead":"Rowena Katherine Merritt","reqFor":"Yasuko Ohashi","desc":"Shift Eritrea’s food systems from production-focused approaches to nutrition outcomes through integrated value chains, schools, food safety, and SBC","full":"Module A — Rapid food systems mapping & priority entry points (≈ 8 weeks) \\n\\nWhat CoE does: Produce a concise map of nutrition-sensitive value chains (e.g., cereals/legumes, dairy) and school-based entry points (gardens/menus), with a baseline of risks and simple indicators. Identify quick wins in food safety and hygiene practices across small processors/school kitchens; map governance and cross-ministry roles (MoA/MoH/MoE/MLWE). \\n\\nWhat it strengthens: Shared picture of “where to start” linking production to nutrition outcomes; early list of feasible pilots; clarity on roles and decision points. \\n\\nStandards/tools: UNICEF food systems/nutrition guidance; simple value-chain and risk screening templates; school nutrition checklist. \\n\\nModule B — Complementary foods mini-pilot (DMK+) & micro-processing support \\n\\nWhat CoE does: Co-design a small DMK+ complementary food mini-pilot: product specifications, quality/batch SOPs, basic HACCP-inspired hygiene steps, packaging/labelling, and micro-processing coaching for 2–3 local producer units (or school kitchens). Develop simple QA tools and a child-feeding counselling card that links to the product. \\n\\nWhat it strengthens: Safe, acceptable complementary foods with clear quality steps; local capacity to produce and coach caregivers; documented micro-processing SOPs for replication. \\n\\nStandards/tools: UNICEF IYCF resources; QA/food safety lite templates; behaviour change job-aids. \\n\\nModule C — Food safety & fortification “lite”: SOPs and training \\n\\nWhat CoE does: Draft light SOPs for hygiene, storage, and fortification/processing suitable for small establishments and schools; run two short training cycles (virtual + in-country practical sessions) for MoH/MoA/MoE/MMR/MTI teams and local producers. Provide model procurement specs (e.g., packaging, basic test kits) and simple monitoring forms. \\n\\nWhat it strengthens: Practical, context-appropriate standards that reduce contamination and variability; entry-level capacity to monitor compliance. \\n\\nStandards/tools: Food safety checklists; school kitchen hygiene SOP; fortification basics; simple monitoring templates. \\n\\nModule D — Healthy diets SBC & school-based pilots (gardens/menus/peer clubs) \\n\\nWhat CoE does: Package an SBC toolkit (scripts/posters/mini-sessions) on diverse diets and safe food handling; set up 10–15 school garden/menu/peer clubs pilots with seasonally feasible crops and a simple menu planning sheet; define a light results log (attendance, menu diversity, hygiene practices). \\n\\nWhat it strengthens: Community and school behaviours for healthier diets; practical experience with school gardens and simple menu standards; early evidence for scale-up. \\n\\nStandards/tools: SBC toolkit; garden starter kit; menu diversity scorecard; hygiene reminders.","xs":46023.0,"xc":46387.0,"cr":46141.47621527778,"op":46141.47621527778,"up":46224.529328703706,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0012489","type":"Big Ticket","region":"EAPR","office":"Mongolia","practice":"Child Nutrition and Development","offer":"Programme Management Scale-Up Support","modality":"Hybrid","status":"25%","lead":"Manpreet Kaur Chadha","reqFor":"Munkhjargal Luvsanjamba","desc":"Technical assistance to establish a sustainable iodised salt system in Mongolia including business analysis, regulatory monitoring, and advocacy.","full":"Technical assistance to support the establishment of a sustainable iodised salt system in Mongolia, encompassing: (i) design and implementation of a salt industry business analysis to assess the feasibility of formal iodised salt production; (ii) strengthening regulatory monitoring and trade quality assurance for iodised salt imports and domestic markets; and (iii) high-level advocacy and policy dialogue to reinforce and operationalise the Food Fortification Law and large-scale food fortification commitments.","xs":46113.0,"xc":46387.0,"cr":46141.47622685185,"op":46141.47622685185,"up":46233.37945601852,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0012490","type":"Big Ticket","region":"ESAR","office":"Somalia","practice":"Child Nutrition and Development","offer":"Programme Management Scale-Up Support","modality":"Hybrid","status":"25%","lead":"Manpreet Kaur Chadha","reqFor":"Nisar Syed","desc":"Strengthen nutrition prevention systems through scalable First Foods approaches","full":"The Somalia Country Office will implement the First Food Initiative for the first time, targeting vulnerable populations with high levels of malnutrition. Day to Day/ Routine technical support from the Regional Office is essential to ensure effective implementation, provide timely operational guidance, facilitate experience sharing from other countries, and build the nutrition team’s capacity for this new initiative. Support is also needed to analyze and apply the landscape study findings and translate them into Somalia’s First Food Strategy and Action Plan","xs":46113.0,"xc":46387.0,"cr":46141.47622685185,"op":46141.47622685185,"up":46233.133310185185,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0012491","type":"Big Ticket","region":"EAPR","office":"Malaysia","practice":"Child Nutrition and Development","offer":"Programme Management Scale-Up Support","modality":"Hybrid","status":"25%","lead":"Alison Feeley","reqFor":"Jui Yee Eng","desc":"Technical support for the development and enforcement of regulatory frameworks to protect children from unhealthy food and BMS marketing.","full":"Technical support for the development and enforcement of regulatory frameworks to protect children from unhealthy food and BMS marketing","xs":46113.0,"xc":46387.0,"cr":46141.47622685185,"op":46141.47622685185,"up":46189.157638888886,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0012492","type":"Big Ticket","region":"SAR","office":"Afghanistan","practice":"Child Nutrition and Development","offer":"Programme Management Scale-Up Support","modality":"Hybrid","status":"75%","lead":"Christiane Rudert","reqFor":"Boniface Kalanda","desc":"Transform Afghanistan’s food systems to reduce child food poverty and deliver safe, affordable first foods at scale","full":"Support is needed to strengthen UNICEF’s capacity to advance First Foods by capacity building for the team on the food systems including the head-hunting of the new TA P4,  technical support on generating evidence and market analysis on First Foods, strategic support in navigating and guiding private-sector engagement, and reinforcing norms and standards on import and production of first foods and technical support on supporting formation or transformation of SMEs for First Foods local solutions, and designing a scalable, nutrition-sensitive cash-for-first-foods model.","xs":46023.0,"xc":46387.0,"cr":46141.47622685185,"op":46141.47622685185,"up":46239.10983796296,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0012493","type":"Big Ticket","region":"ECAR","office":"Kosovo (UN SC resolution 1244)","practice":"Child Nutrition and Development","offer":"Programme Management Scale-Up Support","modality":"Hybrid","status":"50%","lead":"Karan Courtney Haag","reqFor":"Benjamin Samuel Fisher","desc":"Scale a sustainable, government-led school nutrition programme through multisector financing and local food systems","full":"Kosovo is implementing the Nutrition Environment Assessment Tool (NEATs), generating the first national evidence on school food environments and nutrition practices among schoolchildren. The Government requested UNICEF’s support in designing a national programme to improve school nutrition. The TA requested will contribute to supporting the Government to design and implement a cross-sectoral school nutrition programme, fostering collaboration between the education, health, and agriculture sectors. This includes support to translating NEATs findings into high-level policy actions and leveraging funding from Government and IFIs.","xs":46113.0,"xc":46387.0,"cr":46141.47622685185,"op":46141.47622685185,"up":46188.235243055555,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0012494","type":"Big Ticket","region":"ECAR","office":"Georgia","practice":"Child Nutrition and Development","offer":"Programme Management Scale-Up Support","modality":"Hybrid","status":"25%","lead":"Amirhossein Yarparvar","reqFor":"Alexandru Nartea","desc":"Generate evidence to guide nutrition actions for pregnant women and children in conflict-affected Abkhazia region of Georgia","full":"This initiative represents an unprecedented effort in Abkhazia region of Georgia, which remains outside government control and is characterized by a highly sensitive political context. The intervention aims to assess health, nutrition, and overall well-being among vulnerable populations, specifically:\\n• Pregnant women\\n• Children under 5 years old\\n• School-aged children (7–9 years old)\\nThe primary goal is to generate evidence-based insights that will inform the development of targeted nutrition actions for these groups. This approach is critical for addressing gaps in health and nutrition services in a protracted conflict setting.","xs":46113.0,"xc":46387.0,"cr":46141.47622685185,"op":46141.47622685185,"up":46226.35973379629,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0012495","type":"Big Ticket","region":"MENAR","office":"Yemen","practice":"Child Nutrition and Development","offer":"Programme Management Scale-Up Support","modality":"Hybrid","status":"25%","lead":"Mueni Mutunga","reqFor":"Peter Harvey","desc":"Update anemia treatment protocols to improve complementary feeding through feasible, local food solutions","full":"Support the transition from the use of Iron Folic Acid Supplementation for pregnant women to MMS, support the feasibility study on local production of nutrition foods for children under two and support for the implementation of the Food Options approach","xs":46023.0,"xc":46387.0,"cr":46141.47622685185,"op":46141.47622685185,"up":46217.45576388889,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0012496","type":"Big Ticket","region":"SAR","office":"India","practice":"Child Nutrition and Development","offer":"Programme Management Scale-Up Support","modality":"Hybrid","status":"25%","lead":"Joan Matji","reqFor":"Arjan De Wagt","desc":"Strengthen India’s nutrition system to address all forms of malnutrition through evidence-based, multisectoral policy, financing, and accountability","full":"The technical assistance will provide expert guidance on implementing policies, public an private financing, drafting legislation, and designing programs for pre-conception and maternal nutrition, early growth faltering, infant and young child nutrition, and overweight prevention. It will also support the development of a knowledge-generation agenda aligned with India’s priorities. Additionally, the assistance will strengthen climate-smart nutrition strategies and innovative financing models, including leveraging climate funds and the Child Nutrition Fund. This support aims to position nutrition as a core priority in the 2028–2032 India Country Programme while developing an adapted set of indicators to measure UNICEF’s contribution to India’s Nutrition Agenda.","xs":46023.0,"xc":46295.0,"cr":46141.47622685185,"op":46141.47622685185,"up":46239.11275462963,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0012497","type":"Big Ticket","region":"ESAR","office":"Madagascar","practice":"Child Nutrition and Development","offer":"Programme Management Scale-Up Support","modality":"Hybrid","status":"50%","lead":"Manpreet Kaur Chadha","reqFor":"Landy Hasofera","desc":"Design UNICEF Madagascar’s First Foods initiative to reduce child food poverty","full":"UNICEF Madagascar benefits from a large First Food Grant starting early 2026- We request for technical support at the inception phase to help design the solutions which will be multi-sectorials and involving private sector.","xs":46023.0,"xc":46387.0,"cr":46141.47623842592,"op":46141.47623842592,"up":46233.20909722222,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0012498","type":"Big Ticket","region":"ESAR","office":"United Rep. of Tanzania","practice":"Child Nutrition and Development","offer":"Programme Management Scale-Up Support","modality":"Hybrid","status":"50%","lead":"Manpreet Kaur Chadha","reqFor":"Siphiwe Mbambara","desc":"Reduce child food poverty in Tanzania by scaling First Foods Africa through policy reform and local production","full":"Technical assistance to select FFA companies, including technical and financial assessment of companies, emerged through the 2025 EOI process.","xs":46023.0,"xc":46387.0,"cr":46141.47623842592,"op":46141.47623842592,"up":46233.20576388889,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0012499","type":"Big Ticket","region":"WCAR","office":"Democratic Republic of Congo","practice":"Child Nutrition and Development","offer":"Programme Management Scale-Up Support","modality":"Hybrid","status":"25%","lead":"Federica Margini","reqFor":"Mariame Sylla","desc":"Rebalance DRC’s nutrition financing toward prevention-first, government-led systems resilient to recurrent nutrition shocks","fu om targeted nutrition support and continuity of essential services to systems-level measures that strengthen surveillance, early warning, and household resilience. Sri Lanka will have limited fiscal space next year (and the CO will have limited funding) but the need for clear analysis, costed options, and strong advocacy remains urgent. UNICEF will need to identify feasible entry points and shaping an integrated proposal/clear advocacy that government and partners can get behind, rollout and budget for in subsequent years.","xs":46023.0,"xc":46387.0,"cr":46141.47623842592,"op":46141.47623842592,"up":46234.18363425926,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0012502","type":"Big Ticket","region":"ESAR","office":"Kenya","practice":"Child Nutrition and Development","offer":"Programme Management Scale-Up Support","modality":"Hybrid","status":"50%","lead":"Manpreet Kaur Chadha","reqFor":"James Hedges","desc":"Advance First Foods Africa in Kenya","full":"Technical assistance to the establishment and role out of the First Foods Africa Initiative in Kenya, as well as ensuring adeqaute partnership coordination with UNCDF and collaboration with the Global FFA Steering Committee.","xs":46023.0,"xc":46387.0,"cr":46141.47623842592,"op":46141.47623842592,"up":46233.18638888889,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0012503","type":"Big Ticket","region":"SAR","office":"Bangladesh","practice":"Child Nutrition and Development","offer":"Programme Management Scale-Up Support","modality":"Hybrid","status":"25%","lead":"Joan Matji","reqFor":"Deepika Sharma","desc":"Strengthen food environment policies through front-of-pack labeling, nutrient profiling, and SSB taxation","full":"Provide technical expertise, review, and consultation to strengthen the policy framework, legislation, and fiscal measures related to Font-of-Pack labeling, Nutrient Profile Modeling and SSB taxation.","xs":46023.0,"xc":46387.0,"cr":46141.47623842592,"op":46141.47623842592,"up":46141.47623842592,"rs":nu oods, prevention, and CNF governance","full":"NUTRITION: The technical assistance will provide expert guidance to implement nutrition policies, mobilize public and private financing, and draft legislation that strengthens governance for nutrition. It will support the design of scalable, integrated programs for prevention of child wasting, maternal nutrition, and improving access to safe, diverse first foods. Additionally, the assistance will develop a knowledge-generation agenda aligned with Niger’s priorities to inform evidence-based decision-making. It will also reinforce national nutrition strategies and innovative financing, leveraging mechanisms such as the Child Nutrition Fund to ensure sustainable interventions across health, food, education, and social protection systems.","xs":46113.0,"xc":46295.0,"cr":46141.476273148146,"op":46141.476273148146,"up":46237.31612268519,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0012544","type":"Big Ticket","region":"WCAR","office":"Democratic Republic of Congo","practice":"Child Nutrition and Development","offer":"Programme Management Scale-Up Support","modality":"Hybrid","status":"0%","lead":"Simeon Nanama","reqFor":"Mariame Sylla","desc":"Strengthen DRC’s IMAM system to deliver accountable, protocol-compliant treatment with protected RUTF supply chains","full":"Technical assistance is required to: (i) strengthen enforcement and compliance with the updated IMAM/PPCMA protocols aligned with WHO 2023; (ii) establish RUTF fraud prevention and traceability mechanisms across the supply chain; (iii) develop and support advocacy and investment cases to mobilize dedicated funding for RUTF procurement; and (iv) generate and translate operational research on protocol adherence and RUTF use into policy and programme decisions.","xs":46113.0,"xc":46387.0,"cr":46141.476273148146,"op":46141.476273148146,"up":46195.22157407407,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0012545","type":"Big Ticket","region":"ESAR","office":"Lesotho","pr on by mothers","full":"Advise on continuity of iron tablet consumption by mothers","xs":46023.0,"xc":46203.0,"cr":46142.48501157408,"op":46142.48501157408,"up":46220.53650462963,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0013595","type":"Routine","region":"WCAR","office":"Togo","practice":"Child Nutrition and Development","offer":"Programme Management Scale-Up Support","modality":"On Site","status":"100%","lead":"Simeon Nanama","reqFor":"Simeon Nanama","desc":"Technical support to the Togo Country Office","full":"Technical support to the Burkina Faso Country Office","xs":46146.0,"xc":46164.0,"cr":46150.129166666666,"op":46150.129166666666,"up":46202.20255787037,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0013685","type":"Routine","region":"ESAR","office":"United Rep. of Tanzania","practice":"Child Nutrition and Development","offer":"Workforce Development and Institution Building","modality":"Online","status":"75%","lead":"Manpreet Kaur Chadha","reqFor":"Michelle Alvarez Garcia Tunon","desc":"Request to review Companies bidding for First Foods Africa in Tanzania","full":"Support with review of 5 bids for institutional consultancy titled: Technical support to strengthen local capacity to produce and supply nutritious foods and supplements for children aged 6 to 24 months in Tanzania.","xs":46155.0,"xc":46295.0,"cr":46155.15063657407,"op":46155.15063657407,"up":46233.388344907406,"rs":null,"cl":null,"hd":1,"ho":0},{"id":"CSR0013698","type":"Routine","region":"ESAR","office":"United Rep. of Tanzania","practice":"Child Nutrition and Development","offer":"Workforce Development and Institution Building","modality":"Online","status":"0%","lead":"Mauro Brero","reqFor":"Michelle Alvarez Garcia Tunon","desc":"Selection of Food Technologist to Support Pillar 1 of Tanzania's FFA","full":"Support the selection process of the following individual consultancy process:\\n\\nFood Technologist (Complementary Foods) – National Individual Consultant\\n\\nScope of Work:\\n\\nThe purpose of this consultancy is to support the development, validation, and scale-up of affordable, safe, and nutrient-dense complementary food products for children aged 6–23 months in Tanzania. \\n\\nKey Tasks\\n\\n• Conduct landscape analysis and stakeholder engagement by reviewing existing complementary food products, supply chains, and regulatory frameworks, mapping key actors (e.g. manufacturers, laboratories, ingredient suppliers, distributors, government agencies, NGOs and academia institutions), and defining product profiles in consultation with stakeholders. With special focus in prioritized regions: Dar es Salaam, Arusha, Mbeya, Mwanza and Zanzibar.\\n• Support the validation of the mapping report and database creation of local food producers. \\n• Support with key partners product research, development, and validation by formulating and optimizing at least two nutrient-dense complementary food products using locally available ingredients. This includes ensuring adequate nutrient density, protein quality, micronutrient bioavailability (e.g. iron, zinc) energy density, safety, and sensory acceptability; defining processing and packaging parameters (e.g. extrusion, roasting, germination), packaging specifications and critical control points; and overseeing laboratory testing and refinement through accredited labs and refine formulations accordingly. \\n• Strengthen food safety, quality assurance, and regulatory compliance systems by supporting the development and implementation of training toolkits (including HACCP, GMP, and SSOP protocols); support building capacity of producers and quality assurance teams through targeted training; developing compliant product labeling in line with national regulations and the International Code of Marketing of Breast-milk Substitutes; and establishing shelf-life testing protocols as well as market surveillance and monitoring mechanisms.\\n• Support local producers and SMEs through continuous, hands-on technical assistance to improve production processes of nutritious first foods, ensure food safety and quality standards are met, and facilitate reformulation of existing products to meet national and international standards.\\n• In collaboration with key partners support the development of business and distribution models by designing costed, sustainable approaches for production and last-mile delivery; identifying risks and mitigation strategies; and exploring market feasibility of the developed products, based on evidence generated.\\n• Support the development of technical tools and strengthen capacity among governments, producers, SMEs, and partners through training materials, standard operating procedures (SOPs), workshops, webinars, and on-site coaching, promoting long-term sustainability using the training toolkit developed by UNICEF.\\n• Facilitate knowledge sharing and coordination by establishing and maintaining a network of local farmers, processors, and stakeholders to promote quality assurance, innovation, and continuous learning, while ensuring regular coordination with UNICEF and partners. \\n• Support the generation and dissemination of evidence on product acceptability, shelf-life, and market potential, and compile a final report summarizing key findings, achievements, challenges, and recommendations for scale-up.\\n• Support other activities agreed as relevant to the objectives of the consultancy.","xs":46160.0,"xc":46167.0,"cr":46155.26833333333,"op":46155.26833333333,"up":46196.39471064815,"rs":null,"cl":null,"hd":1,"ho":0},{"id":"CSR0013715","type":"Routine","region":"WCAR","office":"Guinea","practice":"Child Nutrition and Development","offer":"Programme Management Scale-Up Support","modality":"Online","status":"25%","lead":"Hassan Ali Ahmed","reqFor":"Hawa Sakho","desc":"SMART Survey , Elaboration of Strategique multisectoriel  plan for nutrition and alimentation 2026-2030","full":"SMART Survey, Elaboration of Strategique multisectoriel  plan for nutrition and alimentation 2026-2030 and CNF Programme Window Application.","xs":46160.0,"xc":46356.0,"cr":46160.48667824074,"op":46160.48667824074,"up":46220.252534722225,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0013748","type":"Routine","region":"WCAR","office":"Nigeria","practice":"Child Nutrition and Development","offer":"Humanitarian Action and Resilience","modality":"On Site","status":"100%","lead":"Benjamin Guy Stafford Allen","reqFor":"Nemat Hajeebhoy","desc":"Support for JASW learning and simplified protocol","full":"I hope this message finds you both well. As you know, Nigeria continues to be at the forefront of the Joint Action to Stop Wasting (JASW) initiative. Last year’s joint HQ/RO mission was extremely valuable for our team, and we are now moving full steam ahead into the accelerated implementation phase, ensuring we integrate key recommendations from the 2025 mission along the way.\\n\\nWith less than four months remaining until the pilot concludes, we feel it is essential to bring in an external perspective to review our programme implementation and provide technical input for any necessary course corrections. This kind of support will be especially important in helping us capture and document our learnings and country experiences—an integral requirement for JASW. We also look forward to coordinating this effort closely with our WFP colleagues.\\n\\nIn light of this, we kindly request technical support from the CoE for a 3-4 week in-country mission. The specialist would be based in the Kano Field Office and would play a key role in supporting the rollout of our accelerated plan. We would be truly grateful for this additional layer of support as we move towards the final stages of the pilot.\\n\\nThis request is urgent given the end of the main supporting grant for JASW is in September 2026, and we need to complete documentation, in collaboration with WFP, before then.\\n\\nThe team are working on a full ToR.","xs":46188.0,"xc":46206.0,"cr":46167.34502314815,"op":46167.34501157407,"up":46239.14939814815,"rs":46239.146516203706,"cl":46239.146516203706,"hd":1,"ho":1},{"id":"CSR0013837","type":"Routine","region":"WCAR","office":"Nigeria","practice":"Child Nutrition and Development","offer":"Policy Reform and Programme Design","modality":"Online","status":"75%","lead":"Agnes Erzse","reqFor":"Sumit Karn","desc":"Review Nigeria's Draft Nutrient Profile Model","full":"Provide technical review of Nigeria's first draft of a national Nutrient Profile Model in preparation of FMoHSW-led Technical Working Group (TWG) meeting .","xs":46170.0,"xc":46174.0,"cr":46170.59295138889,"op":46170.59295138889,"up":46220.311423611114,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0014078","type":"Big Ticket","region":"MENAR","office":"MENARO, Jordan","practice":"Child Nutrition and Development","offer":"Financing for Scale","modality":"Hybrid","status":"75%","lead":"Zivai Murira","reqFor":"Abdul Fofana","desc":"“Technical support for MENARO-led regional nutrition consultation with 12 MENA countries and partners to accelerate financing scale-up of nutrition actions.”","full":"“Technical support for MENARO-led regional nutrition consultation with 12 MENA countries and partners to accelerate financing scale-up of nutrition actions.”","xs":46174.0,"xc":46295.0,"cr":46173.1934375,"op":46173.1934375,"up":46226.14356481482,"rs":null,"cl":null,"hd":0,"ho":1},{"id":"CSR0014140","type":"Routine","region":"LACR","office":"Argentina","practice":"Child Nutrition and Development","offer":"Policy Reform and Programme Design","modality":"Online","status":"50%","lead":"Paula Veliz","reqFor":"Veronica Lorena Risso Patron","desc":"Integrated support for healthier food environments, youth engagement and policy action in Argentina.","full":"I kindly request the CoE’s support on food environments, specifically in the following areas: a) Review of self-assessment tool: Provide technical feedback on the food environment self-assessment tool once it becomes available (expected in Q4). b) Policy engagement support: Leverage the SLAN policy space to strengthen engagement with government counterparts This support will be key to ensuring both the quality of the assessment tool and the effectiveness of policy engagement efforts.","xs":46204.0,"xc":46418.0,"cr":46178.408159722225,"op":46178.408159722225,"up":46234.75861111111,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0014161","type":"Routine","region":"LACR","office":"Haiti","practice":"Child Nutrition and Development","offer":"Humanitarian Action and Resilience","modality":"On Site","status":"0%","lead":"Anuradha Narayan","reqFor":"Kalil Sagno","desc":"he Haiti country office is seeking availability for a potential mission in July 2026 to address deliverables related to the SMART survey process, including stra","full":"Dear Amal The SMART process is now proceeding in the right direction, and we should be able to deliver preliminary report in July. Because of that we would like to benefit from your experience with the following deliverables: Strengthening strategic communication around the preliminary SMART survey results to support advocacy and resource mobilization efforts; Reviewing progress made under the JASW and contribute to identify practical solutions to address remaining bottlenecks and accelerate the implementation of the UNICEF–WFP joint workplan; Contributing to the finalization of the technical and operational documents required for the implementation of the integrated Nutrition and Food Security package in Haiti; Initiating discussions with the MoH to help define a clear roadmap for the TA related to nutrition diploma training programs in Haiti. Explore how health and nutrition platforms could be further leveraged to strengthen more integrated approaches around ECD, parenting support and nurturing care Therefore, Haiti country office is seeking your availability for a potential mission in Haiti in July 2026 for about a week.","xs":46209.0,"xc":46234.0,"cr":46180.887708333335,"op":46180.887708333335,"up":46188.38013888889,"rs":null,"cl":null,"hd":1,"ho":0},{"id":"CSR0014164","type":"Big Ticket","region":"EAPR","office":"Cambodia","practice":"Child Nutrition and Development","offer":"Policy Reform and Programme Design","modality":"Hybrid","status":"0%","lead":"Louise Mwirigi","reqFor":"Julia Battle","desc":"Technical assistance in drafting a study protocol for a micronutrient and heavy metal survey.","full":"We need technical assistance in drafting a study protocol for a micronutrient and heavy metal survey. This request is for the micronutrient component, which should be designed to be comparable to the Cambodia 2014 DHS. The person needs to understand national survey design as well as be an expert in micronutrients. This is a very high profile important piece of work for the country bringing many stakeholders together. Work is already underway for the broader survey design with the CEH COE.","xs":46185.0,"xc":46568.0,"cr":46181.057118055556,"op":46181.057118055556,"up":46191.414456018516,"rs":null,"cl":null,"hd":1,"ho":0},{"id":"CSR0014175","type":"Routine","region":"EAPR","office":"Timor-Leste","practice":"Child Nutrition and Development","offer":"Programme Management Scale-Up Support","modality":"Hybrid","status":"25%","lead":"Christiane Rudert","reqFor":"Faraja Chiwile","desc":"technical support request to strengthen he capacity of public and private (Small and Medium Entrepreneur) stakeholders in producing quality diets for children 6","full":"Strengthening the capacity of public and private (Small and Medium Entrepreneur) stakeholders in producing quality diets for children 6-23 months. Given the poor diet among children in Timor-Leste and the high burden of stunting, and following the recommendations of the study on the analysis of barriers and enablers to children's diets 6-23 months, the Government is interested in investing in local and sustainable solutions to improve the quality of children's diets. In the absence of the private sector and with funding support from UNICEF Australia, UNICEF TLCO is partnering with the Tanzania Food and Nutrition Centre (TFNC) to provide technical assistance to SMEs in Timor-Leste to build their capacity to strengthen the food system for sustainable diets for children 6-23 months. Hence, support is needed to UNICEF TLCO on the food system for children, including linking with Mahidol University for nutrient analysis, generating evidence, costing and market model analysis, and reinforcing norms and standards for produced foods, and designing a scalable cash-transfer-for-child diet model. Also, the social marketing of child feeding behaviour. Expected Outcome Facilitate agreement with Mahidol University for nutrient food content analysis (Q3 2026) Establishment of standards for production of complementary foods, aligned with WHO 2023 and CODEX Guidance. (Codex Alimentarius Commission). (Q4 2026) Comprehensive First Foods market and value-chain analysis, including SME landscape, demand patterns, and affordability modelling (Q4 2026) Support on Social Marketing on feeding behaviour campaign (Q1-Q4 2026)","xs":46183.0,"xc":46387.0,"cr":46182.05956018518,"op":46182.05956018518,"up":46236.98763888889,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0014176","type":"Routine","region":"EAPR","office":"Timor-Leste","practice":"Child Nutrition and Development","offer":"Policy Reform and Programme Design","modality":"Hybrid","status":"25%","lead":"Alison Feeley","reqFor":"Faraja Chiwile","desc":"Technical assistance to provide expert guidance on implementing strategies, designing and reviewing programs for School Age Children and Adolescents and m","full":"The technical assistance will provide expert guidance on implementing strategies, designing and reviewing programs for School Age Children and Adolescents and maternal nutrition. The support will include the data analysis and triangulation for the development of a replicable programme for School Age Children and Adolescents (introduce and progressive scale-up), and review and strengthen maternal programme. Also, costing, budgeting, planning and development of a knowledge-generation agenda aligned with Timor-Leste priorities. Expected Outcome Review of nutrition interventions and indicators for school age children and adolescent (Q1 2026) Support to integration of school age children and adolescent nutrition interventions into strategies (Q3-4 2026) Review of maternal nutrition interventions (Q2 2026) Identify strategies to strengthen maternla nutrition interventions (Q3 2026)","xs":46182.0,"xc":46387.0,"cr":46182.06079861111,"op":46182.06079861111,"up":46182.07020833333,"rs":null,"cl":null,"hd":1,"ho":0},{"id":"CSR0014177","type":"Routine","region":"EAPR","office":"Timor-Leste","practice":"Child Nutrition and Development","offer":"Programme Management Scale-Up Support","modality":"Hybrid","status":"50%","lead":"Alex Mokori","reqFor":"Faraja Chiwile","desc":"UNICEF support to TLCO MOH on MUAC simplification ","full":"UNICEF TLCO supported the MoH to simplify management of acute malnutrition (expand MUAC enrollment to <130mm, ration, and follow-up visit revision, exit criteria, following a MUAC/WHZ overlap analysis in 2020) which is implemented as part of primary health care to improve quality of services and leave no child behind. Currently an operational research is on-going - the results and recommendations will facilitate understanding on key performance indicators and programme efficiency. The TLCO will require technical support to finalise study, data analysis and synthesis, conduct costing, advocacy for adoption of recommendation and incorpotating the study findings into the national wasting management guideline. Also, capacity building of health worker thropugh revision of Specific Nutrition Intervention Package (SNIP) guidelines. Expected outcome Support the analysis and data synthesis, and irevision of the guidelines and indicators (Q3-4, 2026) Facilitate costing of the simplified (Q4 2026)","xs":46182.0,"xc":46387.0,"cr":46182.06208333333,"op":46182.06208333333,"up":46217.197060185186,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0014178","type":"Routine","region":"ECAR","office":"Greece","practice":"Child Nutrition and Development","offer":"Programme Management Scale-Up Support","modality":"Hybrid","status":"0%","lead":"Annalies Borrel","reqFor":"Aspasia Plakantonaki","desc":"Technica request to develop a concise, visually engaging Programme Synopsis/communication product documenting UNICEF Greece’s National Action against Childhood ","full":"UNICEF Greece, in partnership with the Hellenic Ministry of Health, has completed the implementation of the National Action against Childhood Obesity (2023–2025), funded through the EU Recovery and Resilience Facility. The programme encompassed primary, secondary and tertiary prevention interventions targeting children aged 0–17 and their families, spanning home, school, health services and community settings, and engaged a wide range of stakeholders including paediatricians, nutritionists, municipalities and civil society partners. With the programme cycle now concluded, UNICEF Greece is requesting Technical Assistance from the Centre of Excellence to develop a Programme Synopsis/Communication Product — a concise, visually compelling and widely disseminable knowledge product for global UNICEF audiences (including all relevant Country Offices), government counterparts, donors and partners, in coordination with the UNICEF Greece Country Office Programme and Comms team. The document should capture the key strategic shifts achieved, document core programme design parameters, highlight methodologies, tools and approaches developed and applied, and consolidate lessons learnt and good practices in a format suitable for replication in other national contexts. The product will serve as a key outcome document for dissemination through UNICEF's ICON platform and other global knowledge-sharing channels, contributing to UNICEF's broader evidence base on national-level childhood obesity prevention.","xs":46183.0,"xc":46386.0,"cr":46182.319444444445,"op":46182.31943287037,"up":46195.33083333333,"rs":null,"cl":null,"hd":1,"ho":0},{"id":"CSR0014185","type":"Routine","region":"SAR","office":"Afghanistan","practice":"Child Nutrition and Development","offer":"Workforce Development and Institution Building","modality":"Hybrid","status":"0%","lead":"Christiane Rudert","reqFor":"Gilbert Dachi","desc":"UNICEF Afganistan Nutrition is integration of climate resilience within nutrition programming. The workshop will bring together participants from\xA0NGOs, UN agenc","full":"UNICEF Afganistan Nutrition is integration of climate resilience within nutrition programming. The workshop will bring together participants from NGOs, UN agencies, development partners, and relevant sectors such as Nutrition, Health, and WASH to promote a multisectoral approach to addressing climate-related risks affecting nutrition outcomes. With the recent rollout of the First Food Initiative in Afghanistan, this workshop will also explore opportunities to link First Food approaches with climate-resilient and climate-sensitive programming in the country context. To support this effort, we are requesting facilitation support from a senior Nutrition Advisor / technical experts from the Centre of Excellence (CoE) in the relevant thematic area. The support will include planning and execution of the workshop, specifically conduct a desk review of key country-level documents and providing in-person facilitation of the 3-day training. The Senior advisor/technical expert will help strengthen technical content, guide cross-sector discussions, and contribute to the development of practical recommendations and action points to enhance climate-resilient and nutrition-sensitive programming in Afghanistan.","xs":46419.0,"xc":46660.0,"cr":46182.40603009259,"op":46182.40603009259,"up":46234.1909375,"rs":null,"cl":null,"hd":1,"ho":1},{"id":"CSR0014252","type":"Big Ticket","region":"MENAR","office":"Lebanon","practice":"Child Nutrition and Development","offer":"Humanitarian Action and Resilience","modality":"Hybrid","status":"100%","lead":"Najwa Al Dheeb","reqFor":"Janneke Blomberg","desc":"Lebanon is facing a severe humanitarian crisis with widespread displacement, affecting children and caregivers' access to nutrition, early childhood development","full":"Lebanon is facing a severe and escalating humanitarian crisis, with the most recent shocks resulting in the displacement of an estimated 10–20 per cent of the population. Many displaced families are now living in precarious and temporary accommodation, including collective shelters, tents, unfinished or overcrowded rented housing, and with host families. These conditions have had a profound impact on children and caregivers, severely disrupting diets, access to essential nutrition and early childhood development (ECD) services, and caregiving practices for infants, young children, adolescent girls, and pregnant and breastfeeding women. Widespread displacement, economic hardship, and insecurity are placing intense pressure on families’ ability to provide adequate nutrition and nurturing care. Children are growing up in environments characterized by instability, overcrowding, limited privacy, and poor conditions for food preparation, storage, hygiene, play, and early stimulation. Heightened caregiver stress, poverty, repeated disruption, and the erosion of family and community support systems are increasing risks of malnutrition, inappropriate feeding practices, and long‑term developmental harm. Caregivers face mounting barriers, including limited access to diverse and nutritious foods; unsafe and unsolicited donations of breastmilk substitutes and ultra‑processed foods; and reduced opportunities for breastfeeding, responsive feeding, and nurturing care. Disruptions to routine health, nutrition, and ECD services further undermine families’ capacity to sustain appropriate diets and caregiving practices during this period of acute vulnerability. In response, UNICEF, in close coordination with the Ministry of Public Health (MoPH) and Nutrition Sector partners, is implementing an integrated, life‑cycle nutrition response to protect child survival, growth, and development. This includes infant and young child feeding (IYCF) and ECD counselling, wasting screening and treatment, preventive and emergency nutrition supplies, nutrition risk communication, protection of breastfeeding through regulation of breastmilk substitutes, and nutrition surveillance, delivered through health, community, education, and digital platforms. As the Nutrition Sector/Cluster lead and main technical partner for nutrition and ECD in Lebanon, UNICEF provides technical leadership, strengthens frontline capacity, ensures continuity of essential supplies, supports coordination and information management, and maintains last‑resort service delivery where gaps persist. Within this context, short‑term technical assistance is required to support the operationalization of new capacity‑strengthening roles, consolidate nutrition education across the life course, develop initial technical guidance for emerging response modalities, and strengthen nutrition advocacy and resource mobilization to support the strategic design, coherence, and operational readiness of the integrated Nutrition and Child Development emergency response in a rapidly evolving crisis context with particular emphasis on emergency financing, sector coordination, and technical guidance for emerging response modalities.","xs":46175.0,"xc":46442.0,"cr":46184.44363425926,"op":46184.44363425926,"up":46188.313263888886,"rs":46188.313263888886,"cl":46188.31327546296,"hd":1,"ho":1},{"id":"CSR0014269","type":"Routine","region":"HQ","office":"Burkina Faso","practice":"Child Nutrition and Development","offer":"Programme Management Scale-Up Support","modality":"On Site","status":"100
